[project]
name = "spanjudge"
version = "0.1.0"
description = "Span-highlighting judge: synthetic span data and a joint label + span model"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "openai>=1.50",
    "datasets",
    "fastapi",
    "uvicorn",
    "nvitop>=1.7.1",
    "torch==2.9.0",
    "torchvision==0.24.0",
    # Nimble's training stack (third_party/nimble/requirements/training.txt).
    "transformers==5.17.0",
    "peft==0.21.0",
    "accelerate==1.15.0",
    "tensorboard",
    "flash-linear-attention==0.5.2",  # fast Gated DeltaNet for Qwen3.5
]

[project.optional-dependencies]
dev = ["pytest", "hypothesis"]

# CUDA 12.8 wheels: run on the 550 driver and on 580+.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spanjudge = ["*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.black]
line-length = 80
skip-magic-trailing-comma = true

[tool.ruff]
line-length = 80
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "I", "D", "N", "UP", "B"]
ignore = ["D107", "D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
force-single-line = true
force-sort-within-sections = true

[tool.ruff.lint.per-file-ignores]
# Adapters override documented abstract methods; Google style allows that.
"src/spanjudge/sources.py" = ["D102"]
