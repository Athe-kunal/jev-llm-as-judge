# Balanced judge-data mix; see docs/data_mix.md for the assumptions.
data_dir: data/mix
seed: 0
llm:
  base_url: http://localhost:8011/v1
  model: judge
  concurrency: 128        # LLM requests in flight
  timeout_s: 600
item_workers: 96          # items judged at the same time
total: 50000              # items over all sources (related + unrelated)
unrelated_share: 0.2      # share of items whose question does not apply
rubrichub_scan: 2000      # rows read per RubricHub file
rubrichub_prompts: 700    # prompts Qwen answers (the rest give unrelated questions)
questions_per_response: 3 # questions asked of each Qwen-written response
respond_max_tokens: 1500
max_generated_prompts: null  # cap on prompts per Qwen-written source (null: all)
tau: 0.05                 # a change in support larger than this counts
# Relative share of each source (default 1): human span-level labels with a
# clean audit get more; small, one-sided or noisier sources get less.
# See docs/data_mix.md, "Source weights".
source_weights:
  ragtruth: 2
  mqm: 2
  prm800k: 2
  beavertails: 0  # CC BY-NC 4.0: not for commercial use
  aegis: 1.5  # replaces BeaverTails (CC BY 4.0)
  processbench: 1.5
  helpsteer2: 1
  ultrafeedback: 1
  rubrichub: 1
  qa_feedback: 0.5
  infobench: 0.5
  ifeval: 0.5
  mushroom: 0.5
  fava: 0.5
