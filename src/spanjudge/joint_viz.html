<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Joint model viewer</title>
<style>
:root{--bg:#f6f6f4;--panel:#fff;--ink:#1d1d1b;--ink2:#55544f;--mute:#8d8c85;--line:#e2e1dc;--gold:#2a78d6;--hl:235,104,52;--ok:#1baf7a;--bad:#e34948}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121211;--panel:#1a1a19;--ink:#f3f3f1;--ink2:#c3c2b7;--line:#2d2d2b;--gold:#3987e5;--hl:217,89,38}}
:root[data-theme=dark]{--bg:#121211;--panel:#1a1a19;--ink:#f3f3f1;--ink2:#c3c2b7;--line:#2d2d2b;--gold:#3987e5;--hl:217,89,38}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0}
h1{font-size:16px;margin:0 10px 0 0}h2{font-size:12px;margin:0 0 6px;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em}
select,button{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:3px 8px;cursor:pointer}
button.primary{background:var(--ink);color:var(--panel)}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--ink2)}
main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;padding:12px 16px;max-width:1900px;margin:0 auto}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:12px}
@media(max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px}
.doc{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.7;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;max-height:62vh;overflow:auto}
.f{border-bottom:3px solid var(--ok);padding-bottom:5px}
.g{text-decoration:underline;text-decoration-color:var(--gold);text-decoration-thickness:3px;text-underline-offset:3px}
.row{display:flex;align-items:center;gap:8px;margin:3px 0}.lab{flex:0 0 130px;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:9px;border-radius:2px;background:var(--mute)}.bar.p{background:rgb(var(--hl))}
.num{color:var(--ink2);font-size:12px}.ok{color:var(--ok)}.bad{color:var(--bad)}.big{font-size:18px;font-weight:600}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2);margin-bottom:8px;flex-wrap:wrap}
</style></head><body>
<header><h1>Joint model viewer</h1>
<select id="src"><option value="">all datasets</option></select>
<select id="lab"><option value="">all gold answers</option></select>
<select id="spn"><option value="">any row</option><option value="with">rows with gold spans</option></select>
<button class="primary" id="go">Random example</button>
<label class="num">threshold <input type="range" id="thr" min="0.05" max="0.95" step="0.05" value="0.5"> <b id="thrv">0.50</b></label>
<span class="pill" id="meta">loading…</span></header>
<main><div id="left"><div class="card">Press <b>Random example</b>.</div></div><div id="right"></div></main>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let M=null,D=null;
async function init(){M=await (await fetch('/api/meta')).json();$('#meta').textContent=`${M.checkpoint} · ${M.order} · ${M.rows} rows`;
 Object.keys(M.labels).sort().forEach(s=>$('#src').insertAdjacentHTML('beforeend',`<option>${esc(s)}</option>`));fill()}
function fill(){const s=$('#src').value;const ls=s?M.labels[s]:[...new Set(Object.values(M.labels).flat())];
 $('#lab').innerHTML='<option value="">all gold answers</option>'+ls.map(l=>`<option value="${esc(l)}">${esc(l.length>40?l.slice(0,40)+'…':l)}</option>`).join('')}
function render(){if(!D)return;if(D.error){$('#left').innerHTML=`<div class="card">${esc(D.error)}</div>`;return}
 const r=D.row,thr=+$('#thr').value;
 const view=p=>{let tp=0,pp=0,gg=0;
  const docs=r.parts.map(part=>{const toks=p.tokens[part.name]||[], gold=r.spans.filter(s=>s.part===part.name);
   const inGold=(a,b)=>gold.some(s=>a<s.end&&b>s.start);const focus=(r.focus||[]).filter(s=>s.part===part.name);const inFocus=(a,b)=>focus.some(s=>a<s.end&&b>s.start);let o='',pos=0;
   for(const [a,b,pr] of toks){o+=esc(part.text.slice(pos,a));const g=inGold(a,b),on=pr>=thr;
    tp+=g&&on;pp+=on;gg+=g;const alpha=on?(0.25+0.6*pr):(pr>0.15?0.12:0);
    o+=`<span class="${g?'g':''} ${inFocus(a,b)?'f':''}" style="${alpha?`background:rgba(var(--hl),${alpha.toFixed(2)})`:''}" title="p=${pr.toFixed(2)}">${esc(part.text.slice(a,b))}</span>`;pos=b}
   o+=esc(part.text.slice(pos));return `<h2>${esc(part.name)}</h2><div class="doc">${o}</div>`}).join('<div style="height:10px"></div>');
  const P=pp?tp/pp:0,R=gg?tp/gg:0,F=P+R?2*P*R/(P+R):0;const right=p.label===r.label;
  const side=`<div class="card"><h2>${esc(p.name)}: decision</h2><div class="big"><span class="${right?'ok':'bad'}">${esc(p.label)}</span> ${right?'<span class="ok">✓</span>':'<span class="bad">✗</span>'}</div>
   <div style="margin-top:8px">${Object.entries(p.probs).map(([k,v])=>`<div class="row"><span class="lab" title="${esc(r.labels[k])}">${esc(k)}</span><div class="bar ${k===p.label?'p':''}" style="width:${v*150}px"></div><span class="num">${v.toFixed(2)}</span></div>`).join('')}</div>
   <h2 style="margin-top:10px">${esc(p.name)}: evidence at ${thr.toFixed(2)}</h2><div>gold tokens <b>${gg}</b> · marked <b>${pp}</b></div><div class="num">${gg||pp?`P ${P.toFixed(2)} · R ${R.toFixed(2)} · <b>F1 ${F.toFixed(2)}</b>`:'no evidence on either side ✓'}</div></div>`;
  return {docs,side}};
 const vs=D.preds.map(view);
 const legend=`<div class="legend"><span><span class="g">blue underline</span> = gold evidence${r.focus?' (for Nimble: our Qwen 27B annotation, 5 of 8 votes)':''}</span>${r.focus?'<span><span class="f">green underline</span> = Nimble\'s verified focus evidence</span>':''}<span style="background:rgba(var(--hl),.6);border-radius:2px">orange</span> = model evidence (darker = more confident; faint = below threshold)</div>`;
 $('#left').innerHTML=`<div class="card"><div class="num">${esc(r.id)} · ${esc(r.source)} · ${esc(r.subset||'')} · ${D.preds[0].n_tokens} tokens · ${D.ms} ms</div><h2 style="margin-top:8px">Question</h2><div style="white-space:pre-wrap">${esc(r.question)}</div><div style="margin-top:6px">gold answer: <b>${esc(r.label)}</b> <span class="num">${esc(r.labels[r.label]||'')}</span></div></div>
  <div class="cols">${D.preds.map((p,i)=>`<div class="card"><h2 style="font-size:14px;color:var(--ink)">${esc(p.name)}</h2>${legend}${vs[i].docs}</div>`).join('')}</div>`;
 $('#right').innerHTML=vs.map(v=>v.side).join('')}
async function go(){$('#go').disabled=true;$('#go').textContent='Running…';
 try{D=await (await fetch('/api/sample?'+new URLSearchParams({source:$('#src').value,label:$('#lab').value,spans:$('#spn').value}))).json();render()}catch(e){$('#left').innerHTML='<div class="card bad">Server unreachable.</div>'}
 $('#go').disabled=false;$('#go').textContent='Random example'}
$('#src').onchange=fill;$('#go').onclick=go;$('#thr').oninput=()=>{$('#thrv').textContent=(+$('#thr').value).toFixed(2);render()};
document.addEventListener('keydown',e=>{if(e.key==='n'&&!/select|input/i.test(e.target.tagName))go()});init();
</script></body></html>
