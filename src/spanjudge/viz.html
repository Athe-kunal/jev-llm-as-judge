<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Span judge data</title>
<style>
:root{--bg:#f6f6f4;--panel:#fff;--ink:#1d1d1b;--ink2:#55544f;--mute:#8d8c85;--line:#e2e1dc;
--blue:#2a78d6;--orange:#eb6834;--green:#1baf7a;--red:#e34948;--hl:rgba(235,104,52,.28);--hl2:rgba(27,175,122,.28)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121211;--panel:#1a1a19;--ink:#f3f3f1;--ink2:#c3c2b7;--mute:#8d8c85;--line:#2d2d2b;
--blue:#3987e5;--orange:#d95926;--green:#199e70;--red:#e66767;--hl:rgba(217,89,38,.38);--hl2:rgba(25,158,112,.38)}}
:root[data-theme=dark]{--bg:#121211;--panel:#1a1a19;--ink:#f3f3f1;--ink2:#c3c2b7;--mute:#8d8c85;--line:#2d2d2b;
--blue:#3987e5;--orange:#d95926;--green:#199e70;--red:#e66767;--hl:rgba(217,89,38,.38);--hl2:rgba(25,158,112,.38)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
h1{font-size:16px;margin:0 12px 0 0}h2{font-size:14px;margin:14px 0 6px}
main{padding:12px 16px;max-width:1500px;margin:0 auto}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.tab{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:4px 10px;cursor:pointer;font:inherit}
.tab[aria-selected=true]{background:var(--ink);color:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
th{color:var(--ink2);font-weight:600}.n{text-align:right;font-variant-numeric:tabular-nums}
.split{display:grid;grid-template-columns:minmax(220px,320px) 1fr;gap:12px}
@media (max-width:800px){.split{grid-template-columns:1fr}}
.list{max-height:80vh;overflow:auto;display:flex;flex-direction:column;gap:4px}
.item{text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:6px 8px;cursor:pointer;font:inherit;font-size:12px}
.item[aria-current=true]{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.item small{display:block;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.text{white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid var(--line);border-radius:6px;padding:10px;font-size:13px;background:var(--bg)}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;margin:6px 0}
.hl{background:var(--hl);border-radius:2px}.hu{border-bottom:3px solid var(--blue)}
.num{color:var(--ink2);font-size:12px}.ok{color:var(--green)}.bad{color:var(--red)}
.lab-meets{color:var(--green)}.lab-fails{color:var(--red)}.lab-not_applicable{color:var(--mute)}
.row{display:flex;align-items:center;gap:8px;margin:2px 0}.row .k{width:120px;font-size:12px}.bar{height:10px;background:var(--blue);border-radius:2px}
.step{border-top:1px solid var(--line);margin-top:12px;padding-top:4px}
.callout{border-left:3px solid var(--blue);padding:6px 10px;background:var(--bg);border-radius:0 6px 6px 0}
details{margin:6px 0}summary{cursor:pointer;color:var(--ink2)}
.flow{display:flex;flex-direction:column;gap:0}
.node{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.arrow{color:var(--mute);text-align:center;font-size:18px;line-height:24px}
.dots{position:relative;height:14px;min-width:120px;border-bottom:1px solid var(--line)}
.dots i{position:absolute;top:2px;width:6px;height:6px;border-radius:50%;background:var(--mute);margin-left:-3px}
.dots b{position:absolute;top:0;width:3px;height:12px;background:var(--orange);margin-left:-1px}
select{font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
</style></head><body>
<header><h1>Span judge data</h1><span class="pill" id="prog"></span><span class="pill" id="llm"></span></header>
<main><div class="tabs" id="tabs" role="tablist"></div><div id="view" class="card">loading…</div></main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f=(x,d=2)=>typeof x==='number'?x.toFixed(d):'–';
const pct=x=>x==null?'–':Math.round(x*100)+'%';
const TABS=['Summary','Records','Pipeline','Rejects'];
let S=null,STEPS=null,FULL={},sel=null,lastDone=-1,lastLoad=0;
let tab=(()=>{try{return localStorage.getItem('tab')||'Summary'}catch(e){return 'Summary'}})();
let fSrc='all',fRel='all';

function sec(title,body){return `<section class="step"><h2>${title}</h2>${body}</section>`}
// layers: human spans (blue underline), Qwen spans (orange fill); numbers follow the tested list
function overlay(text,human,qwen,numbered){
  const cuts=new Set([0,text.length]);[...human,...qwen].forEach(s=>{cuts.add(s.start);cuts.add(s.end)});
  const c=[...cuts].sort((a,b)=>a-b);let o='';
  for(let i=0;i<c.length-1;i++){const a=c[i],b=c[i+1];const h=human.some(s=>s.start<=a&&b<=s.end),q=qwen.some(s=>s.start<=a&&b<=s.end);
    const n=numbered.findIndex(s=>s.end===b);
    o+=(h||q)?`<span class="${h?'hu ':''}${q?'hl':''}">${esc(text.slice(a,b))}</span>`:esc(text.slice(a,b));
    if(n>=0)o+=`<sup>${n+1}</sup>`}
  return o}
function distBars(d,mark){return Object.keys(d).map(k=>`<div class="row"><span class="k">${esc(k)}${k===mark?' ◆':''}</span><div class="bar" style="width:${(d[k]||0)*50}%;${k===mark?'':'background:var(--mute)'}"></div><span class="num">${f(d[k],3)}</span></div>`).join('')}
const ck=b=>b?'<span class="ok">yes</span>':'<span class="bad">no</span>';

function recView(r){
  const full=FULL[r.id]||r,fin=r.final,tested=[...fin.spans,...r.dropped].sort((a,b)=>a.start-b.start),q=r.question;
  const gold=r.gold,hasHuman=gold&&gold.spans_annotated!==false;
  const humanSp=hasHuman?gold.spans:[],qwenSp=hasHuman?r.qwen.spans:fin.spans;
  let h=`<div class="callout"><div class="num">${esc(r.source)} · ${q.type} · ${r.related?'related question':'UNRELATED question (from another prompt): expected label <b>unrelated</b>, no spans'}</div><b>${esc(q.text)}</b>
    <details><summary>labels and span rule</summary>${Object.entries(q.labels).map(([k,d])=>`<div class="num"><code>${esc(k)}</code> ${esc(d)}</div>`).join('')}<div class="num"><i>spans:</i> ${esc(q.span_rule)}</div></details></div>`;
  h+=sec('Context',`<div class="text">${esc(r.context)}</div>`);
  h+=sec(`Response · final label <b>${esc(fin.label)}</b> (${gold?'dataset':(r.related?'Qwen':'unrelated by construction')}) · ${fin.spans.length} final span(s)`,
    `<div class="num">${hasHuman?'<span class="hu">blue underline: human spans (final)</span> · <span class="hl">orange: Qwen spans</span> (comparison only)':`<span class="hl">orange: Qwen spans kept</span>${gold?' (label from the dataset, spans from Qwen)':''}`}${r.dropped.length?` · ${r.dropped.length} Qwen span(s) dropped (see tests)`:''}</div>
    <div class="text">${overlay(r.response,humanSp,qwenSp,tested)}</div>`);
  h+=sec(`Judge (Qwen): <b>${esc(r.qwen.label)}</b>${gold?(r.qwen.label===gold.label?' <span class="ok">= human</span>':` <span class="bad">≠ human (${esc(gold.label)})</span>`):''}`,
    `${distBars(r.dist,r.qwen.label)}<div class="num">Qwen spans located ${r.qwen.spans.length} · not found ${r.unlocated} · ambiguous ${r.ambiguous}</div>${full.raw?`<details><summary>raw reply (prefill + generation)</summary><pre>${esc(full.raw)}</pre></details>`:''}`);
  if(tested.length){
    const s0=r.support;
    const rows=tested.map((s,i)=>{const t=s.test;if(!t)return `<tr><td>${i+1}</td><td colspan="9" class="num">${esc(s.text)} — not tested (a score failed)</td></tr>`;
      return `<tr><td>${i+1}</td><td><span class="${s.origin==='human'?'hu':'hl'}">${esc(s.text)}</span><div class="num">${s.origin}${s.reason?' · '+esc(s.reason):''}</div></td>
      <td>${esc(t.counter)}</td><td>${esc(t.paraphrase)}</td>
      <td class="n">${f(t.s_counter,3)}</td><td class="n">${f(t.s_paraphrase,3)}</td><td class="n">${f(t.s_others_rewritten,3)}</td>
      <td>${ck(t.control_ok)}</td><td>${ck(t.necessary)}</td><td>${ck(t.sufficient)}</td><td>${t.kept?'<b class="ok">kept</b>':(s.origin==='human'?'<span class="num">kept (human)</span>':'<span class="bad">dropped</span>')}</td></tr>`}).join('');
    h+=sec('Counterfactual tests',`<div class="num">support for "${esc(fin.label)}" on the original response: <b>${f(s0,3)}</b> · with every span rewritten: <b>${f(r.s_all_rewritten,3)}</b> (label then <b>${esc(r.label_all_rewritten)}</b>${r.label_all_rewritten&&r.label_all_rewritten!==fin.label?', changed':', unchanged'})${r.rounds===2?' · round 2 ran (looked for missed evidence)':''}.<br>Support = p(label)${q.type==='score'?'; for this score question: how far the expected score is below 5 (0-1)':''}.</div>
      <div style="overflow-x:auto"><table><tr><th>#</th><th>span</th><th>counterfactual</th><th>paraphrase (control)</th><th class="n">support: this span rewritten</th><th class="n">support: paraphrased</th><th class="n">support: others rewritten</th><th>control ok</th><th>necessary</th><th>sufficient</th><th>result</th></tr>${rows}</table></div>`);
  }
  if(r.siblings_after&&r.siblings_after.length)h+=sec('Specificity: other criteria of the same rubric, before → after all spans rewritten',
    `<table><tr><th>criterion</th><th class="n">p(yes) before</th><th class="n">after</th></tr>${r.siblings_after.map(x=>`<tr><td>${esc(x.question)}</td><td class="n">${f(x.p_yes_before,3)}</td><td class="n">${f(x.p_yes_after,3)}</td></tr>`).join('')}</table>`);
  return h}

function summary(){
  const R=S.report;if(!R)return '<p>No report yet: it is written when the judge stage finishes.</p>';
  const src=Object.keys(R).filter(k=>R[k]&&typeof R[k]==='object'&&'related' in R[k]),fmtF=x=>x?`${f(x.p)} / ${f(x.r)} / <b>${f(x.f1)}</b>`:'–';
  const rows=[['related items',m=>m.related],['unrelated items',m=>m.unrelated],['rejected',m=>m.rejected],
    ['final labels',m=>Object.entries(m.final_labels||{}).map(([k,v])=>`${esc(k)}:${v}`).join(' ')],
    ['Qwen label = dataset label',m=>pct(m.qwen_label_agrees_with_dataset)],['Qwen spans vs human (char P / R / F1)',m=>fmtF(m.qwen_span_char_vs_human)],
    ['unrelated answered "unrelated"',m=>pct(m.unrelated_answered_unrelated)],['related records with final spans',m=>pct(m.records_with_final_spans)],
    ['spans tested',m=>m.spans_tested],['rewrite failed (refusal / copy)',m=>m.rewrite_failed],['paraphrase control ok',m=>pct(m.control_ok)],
    ['necessary',m=>pct(m.necessary)],['sufficient',m=>pct(m.sufficient)],['passed a test',m=>pct(m.kept)],
    ['label changes when all spans rewritten',m=>pct(m.label_flips_all_rewritten)],['support drops > tau when all rewritten',m=>pct(m.support_drop_all_rewritten_gt_tau)],
    ['round 2 (missed evidence) ran',m=>pct(m.second_round)],['spans from round 2',m=>m.spans_round2],['spans asked with the label given',m=>m.spans_given_label],
    ['specificity: mean |Δ p(yes)| on other questions',m=>f(m.sibling_mean_abs_change,3)]];
  return `<h2>${R.records} records · ${R.exported??'–'} exported to train.jsonl · ${Object.values(R.left_out||{}).reduce((a,b)=>a+b,0)} left out (reasons in report.json) · rejects ${esc(JSON.stringify(R.rejects))}</h2><div style="overflow-x:auto"><table><tr><th></th>${src.map(s=>`<th class="n">${esc(s)}</th>`).join('')}</tr>${rows.map(([k,g])=>`<tr><td>${k}</td>${src.map(s=>`<td class="n">${g(R[s])}</td>`).join('')}</tr>`).join('')}</table></div>
  <p class="num">For human-labeled sources the final spans are the human ones; the tests show how the judge reacts to them. For RubricHub the final spans are Qwen's spans that passed a test.</p>`}

function pipelineView(){
  if(!STEPS)return 'loading…';
  return `<p class="num">How each record is built. Prompt boxes hold the exact text sent to the model; <code>{…}</code> are filled per record.</p><div class="flow">${STEPS.map((s,i)=>`${i?'<div class="arrow">↓</div>':''}<div class="node"><b>${esc(s.title)}</b> <span class="pill">${s.llm?esc(s.llm):'no LLM call'}</span>
    <div class="num" style="margin-top:4px">${esc(s.note)}</div>
    ${s.prompt?`<details><summary>prompt</summary><pre>${esc(s.prompt)}</pre></details>`:''}
    ${s.prefill?`<details><summary>assistant prefill</summary><pre>${esc(s.prefill)}</pre></details>`:''}
    ${s.tasks?`<details><summary>{task} values</summary>${Object.entries(s.tasks).map(([k,t])=>`<div class="num"><b>${esc(k)}</b>: ${esc(t)}</div>`).join('')}</details>`:''}</div>`).join('')}</div>`}

function recordsView(v){
  const sources=[...new Set(S.records.map(r=>r.source))];
  const rs=S.records.filter(r=>(fSrc==='all'||r.source===fSrc)&&(fRel==='all'||String(r.related)===fRel));
  if(!sel||!rs.find(r=>r.id===sel))sel=rs[0]?.id;
  const opt=(id,cur,list)=>`<select id="${id}">${list.map(([v,t])=>`<option value="${v}" ${v===cur?'selected':''}>${t}</option>`).join('')}</select>`;
  const r=rs.find(x=>x.id===sel);
  v.innerHTML=`<div style="margin-bottom:8px;display:flex;gap:8px;flex-wrap:wrap">${opt('fsrc',fSrc,[['all','all sources'],...sources.map(s=>[s,s])])}${opt('frel',fRel,[['all','related + unrelated'],['true','related'],['false','unrelated']])}<span class="num">showing ${rs.length} examples (2 per final label + 2 unrelated per dataset) of ${Object.entries(S.counts||{}).filter(([k])=>fSrc==='all'||k===fSrc).reduce((a,[,v])=>a+v,0)} records</span></div>
  <div class="split"><div class="list">${rs.map(x=>`<button class="item" aria-current="${x.id===sel}" data-id="${x.id}"><span class="pill">${esc(x.source)}</span> <b>${esc(x.final.label)}</b>${x.gold?' (human)':''} · ${x.final.spans.length} spans${x.related?'':' · <i>unrelated</i>'}<small>${esc(x.question.text)}</small></button>`).join('')}</div>
  <div>${r?recView(r):'<p>No records match.</p>'}</div></div>`;
  v.querySelectorAll('.item').forEach(b=>b.onclick=()=>{sel=b.dataset.id;render()});
  $('#fsrc').onchange=e=>{fSrc=e.target.value;render()};$('#frel').onchange=e=>{fRel=e.target.value;render()};
  if(r&&!FULL[r.id])fetch('/api/item/'+r.id).then(x=>x.json()).then(j=>{FULL[r.id]=j;if(sel===r.id&&tab==='Records')render()});
}

function render(){
  if(!S)return;
  const p=S.progress||{};
  $('#prog').textContent=p.finished?'run finished':p.stage?`${p.stage}: ${p.done}/${p.total}${p.rejected?` · ${p.rejected} rejected`:''}`:'no run';
  $('#llm').textContent=`${S.llm.calls} LLM calls · ${(S.llm.tokens_in/1e6).toFixed(2)}M tokens in`;
  $('#tabs').innerHTML=TABS.map(t=>`<button class="tab" role="tab" aria-selected="${t===tab}" data-t="${t}">${t}</button>`).join('');
  document.querySelectorAll('.tab[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;try{localStorage.setItem('tab',tab)}catch(e){}render()});
  const v=$('#view');
  if(tab==='Summary')v.innerHTML=summary();
  else if(tab==='Records')recordsView(v);
  else if(tab==='Pipeline')v.innerHTML=pipelineView();
  else v.innerHTML=S.rejects.length?`<table><tr><th>source</th><th>reason</th><th>reply</th></tr>${S.rejects.map(r=>`<tr><td>${esc(r.source)}</td><td class="bad">${esc(r.reason)}</td><td><pre>${esc((r.raw||'').slice(0,600))}</pre></td></tr>`).join('')}</table>`:'<p>No rejected items.</p>';
}
async function load(){try{lastLoad=Date.now();S=await (await fetch('/api/state')).json();lastDone=(S.progress||{}).done;render()}catch(e){$('#prog').textContent='server unreachable'}}
async function poll(){ // cheap progress check; reload the data only when it moved
  if(document.hidden||(S&&S.progress&&S.progress.finished))return;
  try{const p=await (await fetch('/api/progress')).json();if(p.finished||(p.done!==lastDone&&Date.now()-lastLoad>20000))load()}catch(e){}}
fetch('/api/steps').then(x=>x.json()).then(j=>{STEPS=j;if(tab==='Pipeline')render()});
load();setInterval(poll,5000);
</script></body></html>
